name: Build and Release Launcher

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    strategy:
      # fail-fast: false para que si falla el build de un SO no cancele el
      # del otro — cada uno sube sus propios instaladores al mismo Release.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Cache de Electron
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Instalar dependencias
        run: npm install --include=dev
        env:
          ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
          npm_config_fetch_retries: 5
          npm_config_fetch_retry_maxtimeout: 60000

      - name: Compilar y publicar Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release