name: Build and Release Launcher

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    strategy:
      # fail-fast: false para que si falla el build de un SO no cancele el
      # del otro — cada uno sube sus propios instaladores al mismo Release.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm install --include=dev

      - name: Compilar y publicar Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release