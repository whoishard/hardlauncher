<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Hard Launcher</title>
<style>
  :root {
    --bg-panel-alt: #2c2e33;
    --bg-hover: #35373e;
    --border-subtle: #3c3e46;
    --accent-primary: #a78bfa;
    --accent-primary-hover: #c4b5fd;
    --text-secondary: #b4b6bd;
    --text-primary: #f5f5f6;
    --danger: #f87171;
    --radius-md: 10px;
    --radius-lg: 16px;
    --font-main: 'Segoe UI Variable', 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: var(--font-main);
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
  }

  /* El panel vive un pixel adentro del borde de la ventana: deja lugar
     para que la sombra del sistema (hasShadow en main.js) no quede pegada
     ni cortada contra el contenido. */
  .panel {
    margin: 8px;
    border-radius: var(--radius-lg);
    background: linear-gradient(180deg, rgba(34, 35, 38, 0.97) 0%, rgba(26, 27, 30, 0.97) 100%);
    border: 1px solid var(--border-subtle);
    box-shadow: 0 16px 40px -8px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.02) inset;
    overflow: hidden;
    opacity: 0;
    transform: translateY(6px) scale(0.98);
    animation: rise 0.16s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes rise {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .items { padding: 6px; }

  button.item {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    border-radius: var(--radius-md);
    cursor: pointer;
    text-align: left;
    transition: background 0.12s ease, color 0.12s ease;
  }

  button.item:hover,
  button.item:focus-visible {
    background: var(--bg-hover);
    color: var(--text-primary);
    outline: none;
  }

  button.item:active { background: var(--bg-panel-alt); }

  button.item svg {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
  }

  button.item.accent:hover { color: var(--accent-primary-hover); }
  button.item.accent:hover svg { stroke: var(--accent-primary-hover); }

  .divider {
    height: 1px;
    background: var(--border-subtle);
    margin: 6px 4px;
  }

  button.item.danger { color: #e8a5a2; }
  button.item.danger:hover { background: rgba(248, 113, 113, 0.12); color: var(--danger); }
  button.item.danger:hover svg { stroke: var(--danger); }
</style>
</head>
<body>
  <div class="panel">
    <div class="items">
      <button class="item accent" data-action="home">
        <svg viewBox="0 0 24 24"><path d="M4 12L12 5l8 7M6 10.5V19a1 1 0 001 1h3v-5h4v5h3a1 1 0 001-1v-8.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Inicio
      </button>
      <button class="item accent" data-action="instances">
        <svg viewBox="0 0 24 24"><path d="M12 4l8 4-8 4-8-4 8-4zM4 12l8 4 8-4M4 16l8 4 8-4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Instancias
      </button>
      <button class="item accent" data-action="settings">
        <svg viewBox="0 0 24 24"><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3"/></svg>
        Ajustes
      </button>
      <div class="divider"></div>
      <button class="item danger" data-action="quit">
        <svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19" stroke-linecap="round"/></svg>
        Cerrar
      </button>
    </div>
  </div>

  <script>
    document.querySelectorAll('button.item').forEach((btn) => {
      btn.addEventListener('click', () => {
        window.trayMenu.action(btn.dataset.action);
      });
    });
    // Si el usuario aprieta Escape con el popup enfocado, se cierra igual
    // que si hubiera clickeado afuera.
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') window.trayMenu.dismiss();
    });
  </script>
</body>
</html>
